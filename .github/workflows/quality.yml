name: 📊 Code Quality

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: 🔬 Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: "⚡ Engaging Quality Scanners"
        run: |
          echo -e "\033[38;2;99;102;241m"
          echo "┌──────────────────────────────────────────┐"
          echo "│  📊 OutreachOS Code Quality Gate v2.0    │"
          echo "│  Analyzing code health metrics...        │"
          echo "└──────────────────────────────────────────┘"
          echo -e "\033[0m"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @outreachos/db run build

      - name: 🧪 Type Check All Packages
        id: typecheck
        run: |
          echo "## Type Check Results" > quality-report.md
          echo "" >> quality-report.md

          PASS=0
          FAIL=0

          for pkg in shared api workers; do
            echo -e "\033[38;2;251;191;36m[CHECK] @outreachos/$pkg\033[0m"
            if pnpm --filter @outreachos/$pkg run build 2>&1; then
              echo "| ✅ @outreachos/$pkg | Pass |" >> quality-report.md
              PASS=$((PASS+1))
            else
              echo "| ❌ @outreachos/$pkg | Fail |" >> quality-report.md
              FAIL=$((FAIL+1))
            fi
          done

          echo "pass=$PASS" >> $GITHUB_OUTPUT
          echo "fail=$FAIL" >> $GITHUB_OUTPUT

      - name: 📦 Analyze Bundle Size
        id: bundle
        run: |
          pnpm --filter @outreachos/web run build 2>&1 | tail -40
          
          # Get the .next directory size
          if [ -d "apps/web/.next" ]; then
            SIZE=$(du -sh apps/web/.next | cut -f1)
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "size=N/A" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Post Quality Report
        uses: actions/github-script@v7
        with:
          script: |
            const pass = '${{ steps.typecheck.outputs.pass }}';
            const fail = '${{ steps.typecheck.outputs.fail }}';
            const bundleSize = '${{ steps.bundle.outputs.size }}';
            const status = fail === '0' ? '✅ All Checks Passed' : '⚠️ Some Checks Failed';

            const body = [
              `### 📊 OutreachOS Quality Report`,
              ``,
              `| Check | Status |`,
              `|-------|--------|`,
              `| 🧪 Type Safety | ${fail === '0' ? '✅' : '❌'} ${pass} passed, ${fail} failed |`,
              `| 📦 Bundle Size | ${bundleSize} |`,
              `| 🏗️ Production Build | ✅ Compiled |`,
              ``,
              `> **Verdict:** ${status}`,
              ``,
              `<sub>Powered by OutreachOS Quality Pipeline • ${new Date().toISOString()}</sub>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
