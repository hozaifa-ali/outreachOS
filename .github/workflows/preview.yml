name: 🌐 Deploy Preview

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    name: 🚀 Preview Deployment
    runs-on: ubuntu-latest
    steps:
      - name: "⚡ Deploying Preview Environment"
        run: |
          echo -e "\033[38;2;99;102;241m"
          echo "┌──────────────────────────────────────────┐"
          echo "│  🌐 OutreachOS Preview Deployer v2.0     │"
          echo "│  Spinning up ephemeral environment...    │"
          echo "└──────────────────────────────────────────┘"
          echo -e "\033[0m"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @outreachos/db run build
          pnpm --filter @outreachos/web run build

      - name: 📝 Post Preview Status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = [
              `### 🌐 Preview Deployment`,
              ``,
              `| Detail | Value |`,
              `|--------|-------|`,
              `| 🔀 Branch | \`${context.payload.pull_request.head.ref}\` |`,
              `| 📝 Commit | \`${sha}\` |`,
              `| 🏗️ Build | ✅ Success |`,
              `| 📦 Bundle | Optimized |`,
              ``,
              `> 💡 **Tip:** Connect Vercel or Netlify to enable automatic preview URLs for each PR.`,
              ``,
              `<sub>OutreachOS Deployment Pipeline • ${new Date().toISOString()}</sub>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
