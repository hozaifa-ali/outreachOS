name: 🐳 Docker

on:
  push:
    branches: [ "main" ]

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
            description: "Next.js 15 Frontend"
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
            description: "Fastify REST API"
          - service: ai
            context: apps/ai
            dockerfile: apps/ai/Dockerfile
            description: "Claude AI Microservice"

    steps:
      - name: "⚡ Initializing ${{ matrix.description }}"
        run: |
          echo -e "\033[38;2;99;102;241m[DOCKER] Building ${{ matrix.service }} container...\033[0m"
          echo -e "\033[38;2;16;185;129m[IMAGE]  ghcr.io/${{ github.repository }}/${{ matrix.service }}\033[0m"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "✅ Image Published"
        run: |
          echo -e "\033[38;2;16;185;129m"
          echo "╔══════════════════════════════════════════════╗"
          echo "║  ✅ ${{ matrix.service }} image pushed       ║"
          echo "║  📦 ghcr.io/${{ github.repository }}/${{ matrix.service }}  ║"
          echo "╚══════════════════════════════════════════════╝"
          echo -e "\033[0m"
