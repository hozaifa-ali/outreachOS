name: 🏷️ PR Labeler

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    name: 🤖 Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label PR based on changed files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const labels = new Set();
            const paths = files.map(f => f.filename);

            for (const path of paths) {
              if (path.startsWith('apps/web/'))       labels.add('🖥️ frontend');
              if (path.startsWith('apps/api/'))       labels.add('⚙️ backend');
              if (path.startsWith('apps/workers/'))   labels.add('👷 workers');
              if (path.startsWith('apps/ai/'))        labels.add('🤖 ai');
              if (path.startsWith('packages/db/'))    labels.add('🗄️ database');
              if (path.startsWith('packages/shared/'))labels.add('📦 shared');
              if (path.startsWith('.github/'))        labels.add('🔧 ci/cd');
              if (path.startsWith('infra/'))          labels.add('☁️ infrastructure');
              if (path.endsWith('.md'))               labels.add('📝 docs');
              if (path.includes('Dockerfile') || path.includes('docker-compose'))
                                                      labels.add('🐳 docker');
            }

            // Size label
            const totalChanges = files.reduce((sum, f) => sum + f.changes, 0);
            if (totalChanges < 10)       labels.add('size/XS');
            else if (totalChanges < 50)  labels.add('size/S');
            else if (totalChanges < 200) labels.add('size/M');
            else if (totalChanges < 500) labels.add('size/L');
            else                         labels.add('size/XL 🔥');

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              });
            }

            // Post a summary comment
            const body = [
              `### 🤖 OutreachOS Bot Analysis`,
              ``,
              `| Metric | Value |`,
              `|--------|-------|`,
              `| 📁 Files Changed | ${files.length} |`,
              `| ➕ Additions | ${files.reduce((s, f) => s + f.additions, 0)} |`,
              `| ➖ Deletions | ${files.reduce((s, f) => s + f.deletions, 0)} |`,
              `| 🏷️ Labels | ${[...labels].join(', ')} |`,
              ``,
              `<sub>Automated by OutreachOS CI Pipeline</sub>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
