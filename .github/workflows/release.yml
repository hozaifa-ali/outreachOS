name: 🚀 Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    name: 📦 Auto Release
    runs-on: ubuntu-latest
    steps:
      - name: "⚡ System Boot"
        run: |
          echo -e "\033[38;2;99;102;241m"
          echo '    ____        __                        __  ____  _____'
          echo '   / __ \__  __/ /_________  ____  _____/ /_ / __ \/ ___/'
          echo '  / / / / / / / __/ ___/ _ \/ __ `/ ___/ __ \/ / / \__ \ '
          echo ' / /_/ / /_/ / /_/ /  /  __/ /_/ / /__/ / / / /_/ /___/ /'
          echo ' \____/\__,_/\__/_/   \___/\__,_/\___/_/ /_/\____//____/ '
          echo -e "\033[0m"
          echo ""
          echo -e "\033[38;2;16;185;129m[RELEASE] Generating deployment artifact...\033[0m"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Tag
        id: tag
        run: |
          VERSION="v0.1.$(date +%Y%m%d%H%M)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo -e "\033[38;2;139;92;246m[TAG] $VERSION\033[0m"

      - name: Generate Changelog
        id: changelog
        run: |
          echo "## 📋 What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline --pretty=format:"- %s (%h)" -20 >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📊 Build Stats" >> CHANGELOG.md
          echo "| Metric | Value |" >> CHANGELOG.md
          echo "|--------|-------|" >> CHANGELOG.md
          echo "| 🏗️ Packages | 6 |" >> CHANGELOG.md
          echo "| 🖥️ Frontend | Next.js 15 |" >> CHANGELOG.md
          echo "| ⚙️ Backend | Fastify + Prisma |" >> CHANGELOG.md
          echo "| 🤖 AI Engine | Claude 3.5 Sonnet |" >> CHANGELOG.md
          echo "| 📦 Runtime | Node.js 22 |" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "OutreachOS ${{ steps.tag.outputs.version }}"
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
